<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Job - ONLINE SUVIDHA CORE</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f6fa;
color:#172033;
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

.container{
max-width:700px;
margin:25px auto;
padding:20px;
}

.form-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 15px #0001;
}

h2{
margin-top:0;
}

label{
display:block;
font-weight:bold;
margin-top:16px;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:15px;
}

textarea{
min-height:120px;
resize:vertical;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:22px;
}

button{
padding:14px;
border:0;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.draft{
background:#667085;
color:white;
}

.publish{
background:#087443;
color:white;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

#message{
margin-top:18px;
padding:12px;
text-align:center;
font-weight:bold;
border-radius:8px;
}

.back{
display:inline-block;
margin-bottom:15px;
text-decoration:none;
color:#111827;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<h1>ONLINE SUVIDHA CORE</h1>

<p>Admin — नई सरकारी नौकरी जोड़ें</p>

</header>


<div class="container">

<a class="back" href="dashboard.html">
← Dashboard
</a>


<div class="form-box">

<h2>नई सरकारी भर्ती</h2>


<label>Job Category *</label>

<select id="type">

<option value="bihar">
Bihar Government Job
</option>

<option value="central">
Central Government Job
</option>

</select>


<label>Job / Recruitment Name *</label>

<input
type="text"
id="title"
placeholder="जैसे BPSC Assistant Recruitment 2026"
>


<label>Department / Organisation *</label>

<input
type="text"
id="department"
placeholder="जैसे Bihar Public Service Commission"
>


<label>Qualification</label>

<input
type="text"
id="qualification"
placeholder="जैसे Graduate"
>


<label>Total Vacancy</label>

<input
type="number"
id="vacancy"
placeholder="जैसे 500"
>


<label>Age Limit</label>

<input
type="text"
id="ageLimit"
placeholder="जैसे 18-37 Years"
>


<label>Application Start Date</label>

<input
type="date"
id="startDate"
>


<label>Last Date *</label>

<input
type="date"
id="lastDate"
>


<label>Application Fee</label>

<input
type="text"
id="applicationFee"
placeholder="जैसे ₹100 / Category Wise"
>


<label>Official Notification Link *</label>

<input
type="url"
id="notificationLink"
placeholder="https://..."
>


<label>Official Apply Link *</label>

<input
type="url"
id="applyLink"
placeholder="https://..."
>


<label>Short Description</label>

<textarea
id="description"
placeholder="भर्ती की जरूरी जानकारी..."
></textarea>


<div class="buttons">

<button
type="button"
class="draft"
id="draftBtn">

📝 Save as Draft

</button>


<button
type="button"
class="publish"
id="publishBtn">

🚀 Publish Job

</button>

</div>


<div id="message"></div>

</div>

</div>


<script type="module">

import {
auth,
db
} from "../firebase.js";


import {
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
collection,
addDoc,
doc,
getDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const message =
document.getElementById("message");

const draftBtn =
document.getElementById("draftBtn");

const publishBtn =
document.getElementById("publishBtn");


let currentUser = null;


// ==========================
// ADMIN LOGIN CHECK
// ==========================

onAuthStateChanged(auth, async (user) => {

if(!user){

window.location.href =
"login.html";

return;

}


try{

const adminRef =
doc(
db,
"admins",
user.uid
);

const adminSnap =
await getDoc(adminRef);


if(!adminSnap.exists()){

message.textContent =
"❌ यह account Admin नहीं है।";

draftBtn.disabled = true;
publishBtn.disabled = true;

return;

}


currentUser = user;

message.textContent =
"";

}catch(error){

console.error(error);

message.textContent =
"❌ Admin verification error: "
+ error.message;

}

});


// ==========================
// FORM DATA
// ==========================

function getJobData(status){

return {

title:
document.getElementById("title")
.value.trim(),

department:
document.getElementById("department")
.value.trim(),

type:
document.getElementById("type")
.value,

qualification:
document.getElementById("qualification")
.value.trim(),

vacancy:
document.getElementById("vacancy")
.value
?
Number(
document.getElementById("vacancy").value
)
:
null,

ageLimit:
document.getElementById("ageLimit")
.value.trim(),

startDate:
document.getElementById("startDate")
.value,

lastDate:
document.getElementById("lastDate")
.value,

applicationFee:
document.getElementById("applicationFee")
.value.trim(),

notificationLink:
document.getElementById("notificationLink")
.value.trim(),

applyLink:
document.getElementById("applyLink")
.value.trim(),

description:
document.getElementById("description")
.value.trim(),

status: status,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

};

}


// ==========================
// VALIDATION
// ==========================

function validateJob(){

const title =
document.getElementById("title")
.value.trim();

const department =
document.getElementById("department")
.value.trim();

const notification =
document.getElementById("notificationLink")
.value.trim();

const apply =
document.getElementById("applyLink")
.value.trim();


if(!title){

message.textContent =
"⚠️ Job का नाम भरें।";

return false;

}


if(!department){

message.textContent =
"⚠️ Department भरें।";

return false;

}


if(!notification){

message.textContent =
"⚠️ Official Notification Link डालें।";

return false;

}


if(!apply){

message.textContent =
"⚠️ Official Apply Link डालें।";

return false;

}


return true;

}


// ==========================
// SAVE FUNCTION
// ==========================

async function saveJob(status){

if(!currentUser){

message.textContent =
"❌ Admin login नहीं मिला।";

return;

}


if(!validateJob()){

return;

}


draftBtn.disabled = true;
publishBtn.disabled = true;


if(status === "published"){

message.textContent =
"🚀 Job Publish हो रही है...";

}else{

message.textContent =
"📝 Draft save हो रहा है...";

}


try{

const jobData =
getJobData(status);


const docRef =
await addDoc(
collection(db,"jobs"),
jobData
);


console.log(
"Job saved:",
docRef.id
);


if(status === "published"){

message.textContent =
"✅ Job सफलतापूर्वक Publish हो गई!";

}else{

message.textContent =
"✅ Job Draft में Save हो गई!";

}


}catch(error){

console.error(
"FIREBASE ERROR:",
error
);


message.textContent =
"❌ Error: "
+ error.code
+ " | "
+ error.message;

}


draftBtn.disabled = false;
publishBtn.disabled = false;

}


// ==========================
// BUTTONS
// ==========================

draftBtn.addEventListener(
"click",
function(){

saveJob("draft");

});


publishBtn.addEventListener(
"click",
function(){

saveJob("published");

});

</script>

</body>
</html>
