<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - ONLINE SUVIDHA CORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #0002;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>🔐 Admin Login</h1>

  <p class="subtitle">
    ONLINE SUVIDHA CORE
  </p>

  <label>Email</label>
  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <label>Password</label>
  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <div id="message"></div>

</div>

<script type="module">

import { auth } from "../firebase.js";

import {
  signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

window.login = async function () {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if (!email || !password) {

    message.textContent =
      "Email और Password दोनों भरें।";

    return;
  }

  try {

    const user =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    message.textContent =
      "Login सफल। Admin Panel खोला जा रहा है...";

    window.location.href =
      "dashboard.html";

  } catch (error) {

    message.textContent =
      "Email या Password गलत है।";

  }

};

</script>

</body>
</html>
