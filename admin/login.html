<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - ONLINE SUVIDHA CORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #0002;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>🔐 Admin Login</h1>
  <p class="subtitle">ONLINE SUVIDHA CORE</p>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <div id="message"></div>

</div>

<script type="module">

import { auth } from "../firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  message.textContent = "Login हो रहा है...";

  loginBtn.disabled = true;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.textContent =
      "✅ Login सफल! Admin Panel खोला जा रहा है...";

    setTimeout(() => {

      window.location.href = "dashboard.html";

    }, 700);

  } catch (error) {

    console.error("Firebase Login Error:", error);

    message.textContent =
      "❌ Login Error: " + error.code;

  } finally {

    loginBtn.disabled = false;

  }

});

</script>

</body>
</html>
